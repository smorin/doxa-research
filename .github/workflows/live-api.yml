---
# P20: weekly real-API workflow regression tests.
#
# Runs `pytest -m "live_api and not extended_slow"` against live OpenAI, Perplexity, and Gemini to
# detect drift in user-visible CLI behaviors (streaming, file output,
# append, no-metadata, secret masking, mismatch defense, provider-specific
# passthrough). Sibling to
# extended.yml (which checks model-kind contracts nightly).
#
# Gated on OPENAI_API_KEY, PERPLEXITY_API_KEY, and GEMINI_API_KEY being set
# as repo secrets. The job is informational — failures notify the team but
# do NOT block PR merges.
#
# Security note: this workflow does not use any github.event.* untrusted
# inputs in run: commands; provider secrets are passed via env.

name: Live-API Workflow Tests (weekly)

"on":
  schedule:
    - cron: "0 2 * * 0"   # Sunday 02:00 UTC = Saturday 7pm PDT (6pm PST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api
  # Don't cancel an in-flight weekly — same reasoning as extended.yml.
  cancel-in-progress: false

jobs:
  live_api:
    name: pytest -m "live_api and not extended_slow"
    runs-on: ubuntu-latest
    # Only run live-provider scheduled/manual jobs in the canonical repo.
    # Forks do not receive upstream secrets, and these tests can spend
    # provider quota.
    if: github.repository == 'smorin/doxa-research'
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Run live-API workflow tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # LIVE_API_STRICT=1 turns missing-key skips into pytest failures
          # (see tests/extended/conftest.py::_require_key). Combined with the
          # pre-flight echo below, a missing secret produces both a GitHub
          # annotation naming the env var AND a red pytest line — no more
          # silent provider zero-coverage.
          LIVE_API_STRICT: "1"
        run: |
          [ -n "$OPENAI_API_KEY" ] || { echo "::error::OPENAI_API_KEY missing"; }
          [ -n "$PERPLEXITY_API_KEY" ] || { echo "::error::PERPLEXITY_API_KEY missing"; }
          [ -n "$GEMINI_API_KEY" ] || { echo "::error::GEMINI_API_KEY missing"; }
          uv run pytest -m "live_api and not extended_slow" -v
        continue-on-error: true
